name: Run benchmarks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmarks
        if: |
          contains(github.event.head_commit.message, '[run-bench]') ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.pull_request.title, '[run-bench]')
        run:
          cargo bench --workspace
